<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Form</title>

    <!-- CSS -->
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: blue;
        }

        p {
            text-align: center;
            color: gray;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <!-- HTML -->
    <div class="container">

        <h1>Event Registration</h1>
        <p>Register for your favourite event!</p>

        <form id="eventForm">

            <label>Student Name:</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Phone Number:</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number" required>

            <label>Select Event:</label>
            <select id="event" required>
                <option value="">Choose an event</option>
                <option>Workshop</option>
                <option>Coding Competition</option>
                <option>Dance Competition</option>
                <option>Technical Quiz</option>
            </select>

            <label>Event Date:</label>
            <input type="date" id="date" required>

            <button type="submit">Register Now</button>

        </form>
    </div>

    <!-- JavaScript -->
    <script>
        document.getElementById("eventForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let selectedEvent = document.getElementById("event").value;

            alert("Registration Successful!\nWelcome " + name +
                  "\nYour Event: " + selectedEvent);

            document.getElementById("eventForm").reset();

        });
    </script>

</body>
</html>
